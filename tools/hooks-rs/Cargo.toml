[package]
name = "hooks-rs"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "claude-hooks"
path = "src/main.rs"

[dependencies]
libc = "0.2"
regex-lite = "0.1"
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
