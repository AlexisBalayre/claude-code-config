# Temporary: proves the sandbox smoke test on both runner images. Removed before merge.
name: tmp sandbox smoke
on: pull_request
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends bubblewrap socat
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-user --ro-bind / / --dev /dev --proc /proc true; echo "single: $?"
          bwrap --unshare-user --ro-bind / / --dev /dev --proc /proc \
            bwrap --unshare-user --unshare-net --ro-bind / / --dev /dev --proc /proc true; echo "nested: $?"
