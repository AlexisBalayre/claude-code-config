# The CI half of the /pr-ci-review pipeline (.claude/skills/pr-ci-review):
# a deterministic preflight resolves the head/mode, the model reviews and emits
# a structured record, and a poster script renders that record to the PR (the
# model itself has no write channel). Each run's record is appended to the
# `ci/review-metrics` orphan branch for the /review-retro skill to mine.
#
# Setup for your repo (App install, secret, metrics branch): the commands live
# once, under "The CI review pipeline" in README.md.
name: Claude Code Review

on:
  pull_request:
    # synchronize: without it, any push after the review merges unreviewed code
    # unless a human remembers `@claude review`. The preflight resolves pushes
    # to an incremental review of the delta, and its same-SHA dedupe plus the
    # queue below bound how many runs a push burst costs.
    types: [opened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

env:
  NODE_VERSION: "22"

jobs:
  claude-review:
    # Owner-only: the review bills the owner's Claude subscription, so a PR
    # opened, pushed to, or `@claude review`-commented by anyone else is skipped.
    # `actor` is the PR opener/pusher or the commenter.
    if: |
      github.actor == github.repository_owner && (
        (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude review'))
      )
    runs-on: ubuntu-latest
    # Generous headroom: a run cancelled at the timeout is a fully billed review
    # discarded for want of a few minutes.
    timeout-minutes: 40
    # Queue, never cancel: with cancel-in-progress a second trigger discards a
    # fully billed in-flight review, and without `synchronize` as a trigger a PR
    # can merge green having never been reviewed. GitHub keeps one pending run
    # per group: the running review always completes and posts, and a push burst
    # collapses to a single queued follow-up on whatever the head is by then.
    # Job-level, not workflow-level: a comment without "@claude review" is
    # skipped by the `if` above before it can enter this group; workflow-level
    # concurrency is acquired before the `if`, which makes every review's own
    # summary comment queue a phantom run.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      # For the poster's claude-review commit status, nothing else.
      statuses: write
    outputs:
      skip: ${{ (steps.pr-head.outputs.skip == 'true' || steps.preflight.outputs.skip == 'true') && 'true' || 'false' }}

    steps:
      # Full history, not depth-1: `gh pr diff` rejects a path filter, so a scoped
      # slice needs a merge base (`git diff <merge-base>..HEAD -- <path>`). Shallow,
      # that cannot resolve and reviewers fall back to `git diff HEAD~1 HEAD`, which
      # silently reviews only the last commit of a multi-commit PR.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Toolchain ahead of the PR-head checkout: the metrics step runs on
      # `always()` but still needs pnpm, so a failure before the install would
      # take the record down with it (a review that died at checkout would leave
      # no artifact at all, invisible to the retro's mining).
      - name: Set up pnpm
        # Pinned to a full SHA: this workflow carries secrets + a write token, so
        # third-party actions are pinned, not floated on a mutable tag.
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          # No root package.json: the pnpm version lives in the tooling package.
          package_json_file: tools/review/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: tools/review/pnpm-lock.yaml

      - name: Install review tooling
        run: pnpm install --dir tools/review --frozen-lockfile

      # Land on the PR head, not the default refs/pull/N/merge ref that the
      # pull_request checkout leaves behind. Reviewers, inline-comment line
      # numbers, and `gh pr diff` are all head-vs-base; a merge ref can lag the
      # head, yielding findings that are false on the real head plus a surface
      # the head added that nobody reviewed, and it shifts line numbers so
      # inline comments fail to anchor.
      # A PR can merge, auto-deleting its branch, between the trigger and this
      # checkout; that race would red-fail the run over a review nobody needs.
      # Only an open PR turns a checkout failure into a real error; otherwise
      # the `skip` output short-circuits the rest of the job.
      - name: Checkout PR head
        id: pr-head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          if ! gh pr checkout "$PR_NUMBER"; then
            state=$(gh pr view "$PR_NUMBER" --json state -q .state)
            if [ "$state" = "OPEN" ]; then
              echo "::error::gh pr checkout failed for open PR #$PR_NUMBER"
              exit 1
            fi
            echo "::notice::PR #$PR_NUMBER is $state; nothing left to review."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # Deterministic preflight: head freshness, tree cleanliness, the merge
      # base, and the full/incremental mode decision, all run as a plain step so
      # a failure is a red step the poster turns into a "not reviewed" verdict,
      # never a model stalled at a permission prompt. It also skips the run when
      # the head SHA already has a non-errored record (a synchronize retrigger
      # with nothing new), except on an explicit `@claude review`.
      # The merge base is resolved here, while the checkout is still complete:
      # claude-code-action restores the PR's config paths from the base branch
      # with a `--depth=1` fetch, which grafts `origin/<base>` parentless. From
      # that point `git diff origin/main...HEAD` dies with "fatal: no merge base"
      # whenever main has moved past the PR, so reviewers are handed the
      # base-side SHA and two-dot from it instead.
      - name: Review preflight
        if: steps.pr-head.outputs.skip != 'true'
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REVIEW_TRIGGER: ${{ github.event_name == 'issue_comment' && 'comment' || github.event.action }}
          REVIEW_FORCE_FULL: ${{ github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude review full') }}
        run: pnpm --dir tools/review --silent run review:preflight

      - name: Generate review schema
        if: steps.pr-head.outputs.skip != 'true' && steps.preflight.outputs.skip != 'true'
        id: gen-schema
        run: |
          schema=$(pnpm --dir tools/review --silent run review:print-schema)
          # Escape single quotes so the schema embeds safely in the single-quoted
          # --json-schema token below, whatever its descriptions contain.
          schema=${schema//\'/\'\\\'\'}
          echo "schema=$schema" >> "$GITHUB_OUTPUT"

      # AGENTS.md is startup-read config like CLAUDE.md (which imports it), but
      # the action's SENSITIVE_PATHS list predates it: v1.0.112 restores
      # CLAUDE.md, .claude/ and .mcp.json, not AGENTS.md, so the PR head's copy
      # would execute unreviewed. Apply the action's own treatment first:
      # snapshot the head's copy for reviewers under .claude-pr/, then take the
      # merge base's. Drop this step once upstream restores AGENTS.md itself.
      - name: Restore AGENTS.md from base
        if: steps.pr-head.outputs.skip != 'true' && steps.preflight.outputs.skip != 'true'
        env:
          MERGE_BASE: ${{ steps.preflight.outputs.merge_base }}
        run: |
          mkdir -p .claude-pr
          if [ -f AGENTS.md ]; then cp AGENTS.md .claude-pr/AGENTS.md; fi
          if git cat-file -e "${MERGE_BASE}:AGENTS.md" 2>/dev/null; then
            git checkout "${MERGE_BASE}" -- AGENTS.md
            git restore --staged AGENTS.md
          else
            rm -f AGENTS.md
          fi

      - name: Run Claude Code Review
        if: steps.pr-head.outputs.skip != 'true' && steps.preflight.outputs.skip != 'true'
        id: claude-review
        # Pinned: v1.0.113 has a Claude Code / install.sh path mismatch that
        # leaves the SDK looking for a binary at ~/.local/bin/claude that the
        # installer didn't put there. Tracked upstream in
        # https://github.com/anthropics/claude-code-action/issues/1260
        # Roll forward once a release with the bundled-binary fallback ships.
        # SHA-pinned (secrets + write token); the tag comment tracks the version.
        uses: anthropics/claude-code-action@2cc1ac1331eac7a6a96d716dd204dd2888d0fcd2 # v1.0.112
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            /pr-ci-review

            Pull request: #${{ github.event.pull_request.number || github.event.issue.number }} in ${{ github.repository }}
            ${{ steps.preflight.outputs.mode_line }}
            Merge base: ${{ steps.preflight.outputs.merge_base }}
          # Orchestrator model only: reviewer manifests pin their own tiers, so
          # correctness/security stay on opus regardless. Sonnet here cuts the
          # run's largest context and output share; posted precision is still
          # gated by the per-important opus validators.
          # Every verb the protocol needs is listed: unlisted ones fall through to
          # a permission prompt that nobody is here to answer, and the run halts
          # at the gate with an empty record that reads as a clean review. The
          # allowlist is read-only on purpose: the model reports findings and the
          # poster below writes them, so `gh pr comment`, `gh pr review` and the
          # inline-comment MCP tool are all absent, and a PR whose own diff tells
          # the reviewer to post something has no channel to do it through. `git
          # fetch` and `git checkout` are deliberately absent too: the
          # full-history checkout above already carries every ref the protocol
          # reads, and the only checkout the model could want is reverting the
          # action's config restore, which re-arms the injection that restore
          # exists to disarm.
          claude_args: |
            --model "claude-sonnet-5"
            --allowedTools "Agent,Skill,Read,Glob,Grep,Bash(gh pr diff*),Bash(gh pr view*),Bash(gh api repos/*),Bash(git diff*),Bash(git status*),Bash(git log*),Bash(git show*),Bash(git rev-parse*),Bash(git rev-list*),Bash(git merge-base*),Bash(git grep*)"
            --json-schema '${{ steps.gen-schema.outputs.schema }}'

      # The review's only writer. Ahead of the metrics step because the record's
      # comment count is this step's hand-off, and on `always()` because a run
      # that died still owes the PR a verdict: a green check on an untouched PR
      # is exactly what a clean review looks like. Unlike the model it replaced,
      # this step fails red when it cannot post, so its silence is never
      # mistaken for a clean bill.
      - name: Post review
        if: always() && steps.pr-head.outputs.skip != 'true' && steps.preflight.outputs.skip != 'true'
        env:
          REVIEW_STRUCTURED_OUTPUT: ${{ steps.claude-review.outputs.structured_output }}
          REVIEW_STEP_OUTCOME: ${{ steps.claude-review.outcome }}
          REVIEW_PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REVIEW_COMMIT_SHA: ${{ steps.preflight.outputs.sha }}
          REVIEW_MERGE_BASE: ${{ steps.preflight.outputs.merge_base }}
          GH_TOKEN: ${{ github.token }}
          REVIEW_POSTED_OUTPUT: ${{ github.workspace }}/posted.json
        run: pnpm --dir tools/review --silent run review:post

      - name: Emit review metrics
        # No record for a merged-PR or already-reviewed skip: a review that never
        # ran is not an errored run, and an is_error record for it would pollute
        # the retro's outage signal.
        if: always() && steps.pr-head.outputs.skip != 'true' && steps.preflight.outputs.skip != 'true'
        env:
          REVIEW_EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
          REVIEW_STRUCTURED_OUTPUT: ${{ steps.claude-review.outputs.structured_output }}
          REVIEW_STEP_OUTCOME: ${{ steps.claude-review.outcome }}
          REVIEW_PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REVIEW_COMMIT_SHA: ${{ steps.preflight.outputs.sha }}
          REVIEW_POSTED_INPUT: ${{ github.workspace }}/posted.json
          # pnpm --dir runs the writer in the package dir, so anchor the output to the workspace root where upload-artifact resolves its path
          REVIEW_METRICS_OUTPUT: ${{ github.workspace }}/review-metrics.json
        run: pnpm --dir tools/review --silent run review:metrics

      - name: Upload review metrics
        if: always() && steps.pr-head.outputs.skip != 'true' && steps.preflight.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: review-metrics
          path: review-metrics.json
          if-no-files-found: warn

  # Artifacts expire after 90 days, which would erase the retro's history; the
  # ci/review-metrics orphan branch is the durable sink (one records/<run_id>.json
  # per run). A separate job so `contents: write` never reaches the model-driven
  # review steps above. `always()` because an errored run's record is the retro's
  # outage signal.
  persist-metrics:
    needs: claude-review
    # `result != 'skipped'` matters: issue_comment fires on every PR comment, and
    # without it `always()` would spin this job up for each one claude-review skips.
    if: always() && needs.claude-review.result != 'skipped' && needs.claude-review.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # A cancelled or early-failed review leaves no artifact; that is not this
      # job's error, so tolerate absence and let the guard below no-op.
      - name: Download review metrics
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: review-metrics
          path: ${{ runner.temp }}/review-metrics

      # The contents API, not a checkout + git push: API commits made with the
      # workflow token are signed by GitHub's web-flow key, which a
      # verified-signatures ruleset requires (it rejects the runner's unsigned
      # git commits). A missing branch 404s the PUT, so a deleted
      # ci/review-metrics fails loudly here instead of being silently recreated
      # without its history.
      - name: Append record to ci/review-metrics
        if: steps.download.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          SRC: ${{ runner.temp }}/review-metrics/review-metrics.json
          RUN_ID: ${{ github.run_id }}
        run: |
          path="records/${RUN_ID}.json"
          if gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=ci/review-metrics" --jq .sha >/dev/null 2>&1; then
            echo "record for run ${RUN_ID} already persisted"
            exit 0
          fi
          # Reviews on different PRs can finish together; concurrent appends of
          # distinct records 409 and resolve on retry.
          for attempt in 1 2 3 4 5; do
            if gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
              -f message="review-metrics: run ${RUN_ID}" \
              -f branch="ci/review-metrics" \
              -f content="$(base64 -w0 < "$SRC")" >/dev/null; then
              exit 0
            fi
            sleep "$attempt"
          done
          echo "::error::failed to persist review-metrics record after 5 attempts"
          exit 1
